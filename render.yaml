services:
  # FastAPI Backend Service
  - type: web
    name: jandrishti-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        fromDatabase:
          name: jandrishti-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # Vite Frontend Static Site
  - type: web
    name: jandrishti-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jandrishti-api
          property: host

databases:
  - name: jandrishti-db
    databaseName: jandrishti
    user: jandrishti_user
    plan: free
